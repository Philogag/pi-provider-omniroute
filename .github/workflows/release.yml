name: Release to npm

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  id-token: write  # Required for OIDC trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"  # npm CLI >= 11.5.1 required for trusted publishing
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        # The tag is the release marker; the published version comes from
        # package.json. Refuse to publish if they drift.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $PKG" >&2
            exit 1
          fi

      - name: Test and typecheck
        run: npm test && npm run typecheck

      - name: Publish to npm (OIDC)
        # Trusted publishing: npm exchanges the GitHub OIDC token for a
        # short-lived publish token. No NODE_AUTH_TOKEN needed.
        run: npm publish
