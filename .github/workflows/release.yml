name: Release to npm

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync package version to tag
        # Tag is the source of truth (e.g. `0.0.2` or `v0.0.2`); npm accepts
        # both. `--no-git-tag-version` avoids creating a nested commit/tag.
        run: npm version "$GITHUB_REF_NAME" --no-git-tag-version

      - name: Test and typecheck
        run: npm test && npm run typecheck

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
